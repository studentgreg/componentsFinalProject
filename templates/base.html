<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Flask API Project{% endblock %}</title>
  <!-- Optional enhancement: Bootstrap styling + responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">My Flask API Project</a>
    </div>
  </nav>
  <!-- Guys, this is a simple template, you can change it as you wish -->
  <main class="container">
    {# Flash messages (errors, "no results", etc.) #}
    {% with messages = get_flashed_messages() %}
      {% for msg in messages %}
        <div class="alert alert-warning">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
